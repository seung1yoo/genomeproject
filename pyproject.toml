[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genomeproject"
version = "0.1.0"
description = "Auditable inventory and targeted marker-frequency utilities for WGS result files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0,<2",
  "pysam>=0.22,<0.24",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
genomeproject = "genomeproject.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/genomeproject"]
